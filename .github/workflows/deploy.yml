name: Deploy personal edition

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: personal
      - name: Download public-beta source as personal baseline
        run: git clone --depth 1 https://github.com/yanpei446505484/data-center-english-training.git app
      - name: Apply the fully audited 2600-sentence corrections
        run: git -C app apply "$GITHUB_WORKSPACE"/personal/patches/*.patch
      - name: Apply personal-edition identity and reviewed terminology
        run: |
          cd app
          node -e "let fs=require('fs'); let p=JSON.parse(fs.readFileSync('package.json')); p.name='data-center-english-personal'; fs.writeFileSync('package.json', JSON.stringify(p,null,2)+'\\n')"
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path('index.html')
          path.write_text(path.read_text().replace('<title>数据中心英语培训</title>', '<title>数据中心英语培训｜个人版</title>'))
          for filename in ['src/components/Layout.tsx', 'src/components/AppSidebar.tsx']:
              path = Path(filename)
              path.write_text(path.read_text().replace('数据中心英语培训', '数据中心英语培训 · 个人版'))

          def replace_word_card(text, word, old_cn, new_cn):
              pattern = rf'(\\{{ w: "{word}",[^\\n]*?cn: )"{old_cn}"'
              return re.sub(pattern, rf'\\1"{new_cn}"', text)

          for filename in ['src/data/sentencePart1a.ts', 'src/data/sentencePart14a.ts']:
              path = Path(filename)
              text = replace_word_card(path.read_text(), 'switch', '开关', '切换')
              path.write_text(text)

          for filename in ['src/data/sentencePart1a.ts']:
              path = Path(filename)
              text = replace_word_card(path.read_text(), 'clearly', '恢复', '清楚地')
              path.write_text(text)

          for filename in ['src/data/sentencePart13a.ts', 'src/data/sentencePart13b.ts', 'src/data/sentencePart14a.ts']:
              path = Path(filename)
              text = replace_word_card(path.read_text(), 'switching', '开关', '倒闸操作')
              path.write_text(text)
          PY
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Build
        run: cd app && npm ci && npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: app/dist
      - id: deployment
        uses: actions/deploy-pages@v4
